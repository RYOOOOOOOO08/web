<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <script>
      function 伝言する() {
        const pTag = document.getElementById("伝言エリア");
        const inputTag = document.getElementById("入力内容");
        const txt = inputTag.value;
        if (txt == "") {
          alert("何か入力して!!!");
        } else {
          pTag.textContent = txt;
          alert("伝言をセットしました");
        }
      }
      </script>
  </head>

  <body>
      掲示板
      <p id="伝言エリア">伝言はまだありません</p> 
    <input id="入力内容"><button onclick="伝言する();">セット</button>
  </body>
</html>
